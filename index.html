    <!-- UTM Persistence: salva UTMs/click IDs no localStorage na 1ª visita -->
    <script>
    (function(){
      try {
        var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','campaign_id','adset_id','ad_id','placement'];
        var STORAGE_KEY = 'mrp_utms';
        var qs = new URLSearchParams(window.location.search);
        var current = {};
        var hasAny = false;
        KEYS.forEach(function(k){
          var v = qs.get(k);
          if (v) { current[k] = v; hasAny = true; }
        });
        // utm_slug: vem do parâmetro `mo` (shortlink Marketing Oracle).
        // Validação: 3-32 chars, apenas [a-z0-9] (case-insensitive), normalizado p/ lowercase.
        var moRaw = qs.get('mo');
        var slug = '';
        if (moRaw) {
          var s = String(moRaw).trim().toLowerCase();
          if (/^[a-z0-9]{3,32}$/.test(s)) slug = s;
        }
        if (slug) { current.utm_slug = slug; hasAny = true; }
        if (hasAny) {
          var stored = {};
          try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){}
          // first-touch: só sobrescreve se não havia nada antes
          var merged = Object.keys(stored).length ? stored : current;
          // sempre atualiza click IDs (last-touch para fbclid/gclid)
          if (current.fbclid) merged.fbclid = current.fbclid;
          if (current.gclid) merged.gclid = current.gclid;
          // utm_slug: preserva o primeiro; só grava se ainda não havia
          if (slug && !merged.utm_slug) merged.utm_slug = slug;
          merged._ts = merged._ts || Date.now();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        }
        // Helper global para reanexar UTMs em CTAs/forms
        window.MRP_getUTMs = function(){
          try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ return {}; }
        };

        // === INJEÇÃO NO _mocapi_attr ===
        // Mantida para compatibilidade caso a chave seja consumida server-side
        // por um futuro proxy/edge do Marketing Oracle. O capi-client.js
        // foi removido do <head>, então não há mais corrida pelo storage.
        var ATTR_KEY = '_mocapi_attr';
        var ATTR_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_slug','fbclid','gclid','campaign_id','adset_id','ad_id','placement'];
        function mergeMocapiAttr(){
          try {
            var persisted = {};
            try { persisted = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){}
            var attr = {};
            try { attr = JSON.parse(sessionStorage.getItem(ATTR_KEY) || '{}'); } catch(e){}
            var changed = false;
            ATTR_KEYS.forEach(function(k){
              var v = qs.get(k);
              if (!v && k === 'utm_slug') v = slug;
              if (!v) v = persisted[k];
              if (v && attr[k] !== v) { attr[k] = v; changed = true; }
            });
            if (changed) {
              try { sessionStorage.setItem(ATTR_KEY, JSON.stringify(attr)); } catch(e){}
            }
          } catch(e){}
        }
        mergeMocapiAttr();
      } catch(e){}
    })();
    </script>

    <!-- Early cache-bust: força nova versão antes do React montar -->
    <script>
    (function(){
      try {
        if (!('serviceWorker' in navigator)) return;
        // CRITICAL: Never cache-bust on auth recovery flows — would strip
        // the hash fragment (#access_token=…) and break password reset.
        var _h = window.location.hash || '';
        var _s = window.location.search || '';
        if (_h.indexOf('access_token') !== -1 || _h.indexOf('type=recovery') !== -1 ||
            _s.indexOf('type=recovery') !== -1 || _s.indexOf('code=') !== -1 ||
            window.location.pathname === '/reset-password') {
          return;
        }
        var BUST_KEY = 'mechanic_cache_busted_build';
        var RELOAD_FLAG = 'mechanic_cache_bust_reloaded';
        fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(v){
            if (!v || !v.build_id) return;
            var last = localStorage.getItem(BUST_KEY);
            if (last === v.build_id) { sessionStorage.removeItem(RELOAD_FLAG); return; }
            if (sessionStorage.getItem(RELOAD_FLAG)) return; // evita loop
            sessionStorage.setItem(RELOAD_FLAG, '1');
            localStorage.setItem(BUST_KEY, v.build_id);
            Promise.all([
              navigator.serviceWorker.getRegistrations().then(function(regs){
                return Promise.all(regs.map(function(r){ return r.unregister(); }));
              }),
              ('caches' in window) ? caches.keys().then(function(keys){
                return Promise.all(keys.map(function(k){ return caches.delete(k); }));
              }) : Promise.resolve()
            ]).then(function(){
              // Preserve existing query and hash so deep links/tokens survive
              var sep = _s ? (_s.indexOf('_b=') === -1 ? (_s + '&') : _s) : '?';
              if (sep === '?') sep = '?';
              var qs = _s
                ? (_s.indexOf('_b=') === -1 ? _s + '&_b=' + v.build_id : _s)
                : '?_b=' + v.build_id;
              location.replace(location.pathname + qs + _h);
            });
          })
          .catch(function(){});
      } catch(e) {}
    })();
    </script>
